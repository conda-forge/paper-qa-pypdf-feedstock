{% set name = "paper-qa-pypdf" %}
{% set version = "2026.8.12" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/paper_qa_pypdf-{{ version }}.tar.gz
  sha256: e5523da1f242b60bc2f666ac1d8ec260e2b5657665b32b91a0a30f6839f1d84f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=64
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - pypdf >=3
    - paper-qa

test:
  imports:
    - paperqa_pypdf
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: PaperQA readers implemented using PyPDF
  home: https://github.com/Future-House/paper-qa
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
